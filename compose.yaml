services:
  postgres:
    image: postgres:17-alpine
    container_name: aelora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aelora
      POSTGRES_USER: aelora
      POSTGRES_PASSWORD: ${AELORA_POSTGRES_PASSWORD:?Set AELORA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aelora -d aelora"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aelora_postgres_data:/var/lib/postgresql/data

volumes:
  aelora_postgres_data:
